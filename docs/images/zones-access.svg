<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d"><title id="t">Zone e accessi — esempio di segmentazione</title><desc id="d">Le reti amministrativa, fidata, ospiti e IoT attraversano IPTM per il traffico instradato.</desc><rect width="1000" height="340" rx="22" fill="#f3f7fa"/><g font-family="Arial,sans-serif" fill="#17334e"><text x="40" y="45" font-size="24" font-weight="bold">Zone e accessi — esempio di segmentazione</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#60839a"/></marker></defs><rect x="380" y="113" width="240" height="84" rx="12" fill="#fff" stroke="#087b68" stroke-width="2"/><text x="500" y="145" text-anchor="middle" font-weight="bold" font-size="18">IPTM</text><text x="500" y="169" text-anchor="middle" font-size="13" fill="#50687b">Firewall / routing</text><rect x="30" y="79" width="265" height="84" rx="12" fill="#fff" stroke="#087b68" stroke-width="2"/><text x="162.5" y="111" text-anchor="middle" font-weight="bold" font-size="18">Amministrazione</text><text x="162.5" y="135" text-anchor="middle" font-size="13" fill="#50687b">Accessi web e SSH</text><rect x="30" y="210" width="265" height="84" rx="12" fill="#fff" stroke="#396b9c" stroke-width="2"/><text x="162.5" y="242" text-anchor="middle" font-weight="bold" font-size="18">LAN fidata</text><text x="162.5" y="266" text-anchor="middle" font-size="13" fill="#50687b">Servizi autorizzati</text><rect x="705" y="79" width="265" height="84" rx="12" fill="#fff" stroke="#b77538" stroke-width="2"/><text x="837.5" y="111" text-anchor="middle" font-weight="bold" font-size="18">Ospiti</text><text x="837.5" y="135" text-anchor="middle" font-size="13" fill="#50687b">Uscita secondo policy</text><rect x="705" y="210" width="265" height="84" rx="12" fill="#fff" stroke="#b77538" stroke-width="2"/><text x="837.5" y="242" text-anchor="middle" font-weight="bold" font-size="18">IoT / VLAN</text><text x="837.5" y="266" text-anchor="middle" font-size="13" fill="#50687b">Isolamento e DNS locale</text><path d="M295 121L380 143" fill="none" stroke="#60839a" stroke-width="3" marker-end="url(#a)"/><path d="M295 252L380 178" fill="none" stroke="#60839a" stroke-width="3" marker-end="url(#a)"/><path d="M705 121L620 143" fill="none" stroke="#60839a" stroke-width="3" marker-end="url(#a)"/><path d="M705 252L620 178" fill="none" stroke="#60839a" stroke-width="3" marker-end="url(#a)"/><text x="500" y="247" font-size="14" text-anchor="middle">Policy tra reti</text><text x="500" y="267" font-size="14" text-anchor="middle">e servizi consentiti</text><text x="35" y="320" fill="#50687b" font-size="13">Il traffico diretto nello stesso segmento L2 non attraversa necessariamente il firewall.</text></g></svg>