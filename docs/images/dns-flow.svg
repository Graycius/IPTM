<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d"><title id="t">DNS e privacy — esempio di percorso</title><desc id="d">I client inviano richieste a un DNS locale. Il resolver può scegliere Unbound oppure un inoltro cifrato DNSCrypt.</desc><rect width="1000" height="340" rx="22" fill="#f3f7fa"/><g font-family="Arial,sans-serif" fill="#17334e"><text x="40" y="45" font-size="24" font-weight="bold">DNS e privacy — esempio di percorso</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#60839a"/></marker></defs><rect x="34" y="119" width="190" height="86" rx="12" fill="#fff" stroke="#087b68" stroke-width="2"/><text x="129" y="151" text-anchor="middle" font-weight="bold" font-size="18">Client LAN / IoT</text><text x="129" y="175" text-anchor="middle" font-size="13" fill="#50687b">Richieste DNS</text><rect x="300" y="119" width="230" height="86" rx="12" fill="#fff" stroke="#087b68" stroke-width="2"/><text x="415" y="151" text-anchor="middle" font-weight="bold" font-size="18">DNS locale / Pi-hole</text><text x="415" y="175" text-anchor="middle" font-size="13" fill="#50687b">Filtraggio configurato</text><rect x="630" y="77" width="325" height="86" rx="12" fill="#fff" stroke="#087b68" stroke-width="2"/><text x="792.5" y="109" text-anchor="middle" font-weight="bold" font-size="18">Unbound</text><text x="792.5" y="133" text-anchor="middle" font-size="13" fill="#50687b">Risoluzione ricorsiva</text><rect x="630" y="205" width="325" height="86" rx="12" fill="#fff" stroke="#087b68" stroke-width="2"/><text x="792.5" y="237" text-anchor="middle" font-weight="bold" font-size="18">DNSCrypt-proxy</text><text x="792.5" y="261" text-anchor="middle" font-size="13" fill="#50687b">Inoltro cifrato</text><path d="M224 162L300 162" fill="none" stroke="#60839a" stroke-width="3" marker-end="url(#a)"/><path d="M530 151L630 120" fill="none" stroke="#60839a" stroke-width="3" marker-end="url(#a)"/><path d="M530 174L630 248" fill="none" stroke="#60839a" stroke-width="3" marker-end="url(#a)"/><text x="34" y="316" font-size="14" fill="#50687b">Percorsi alternativi secondo la configurazione; reindirizzamento DNS e filtri DoT a livello firewall.</text></g></svg>