name: Syntax and regression checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP CLI available
        run: |
          if ! command -v php >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y php-cli
          fi
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find modules actions loader -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Python syntax without importing privileged code
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q extensions runtime tests installer
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find assets -type f -name '*.js' -print0)
      - name: Bash syntax
        run: |
          bash -n runtime/iptm-helper installer/install.sh
      - name: Fast offline regression tests (no live firewall modifications)
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/extensions:${PYTHONPATH:-}"
          failures=0
          if ! python tests/test_optimizer.py; then
            echo "::error::Regression suite failed: python tests/test_optimizer.py"
            failures=$((failures + 1))
          fi
          if ! python tests/test_ssh_qos_5301.py; then
            echo "::error::Regression suite failed: python tests/test_ssh_qos_5301.py"
            failures=$((failures + 1))
          fi
          if ! python tests/test_5304_hardening.py; then
            echo "::error::Regression suite failed: python tests/test_5304_hardening.py"
            failures=$((failures + 1))
          fi
          if ! python tests/test_proxy_retirement_5312.py; then
            echo "::error::Regression suite failed: python tests/test_proxy_retirement_5312.py"
            failures=$((failures + 1))
          fi
          if ! python tests/test_dhcp_53023.py; then
            echo "::error::Regression suite failed: python tests/test_dhcp_53023.py"
            failures=$((failures + 1))
          fi
          if ! python tests/test_firewall_53023.py; then
            echo "::error::Regression suite failed: python tests/test_firewall_53023.py"
            failures=$((failures + 1))
          fi
          if ! php tests/test_regressions.php; then
            echo "::error::Regression suite failed: php tests/test_regressions.php"
            failures=$((failures + 1))
          fi
          if ! php tests/test_service_combinations.php; then
            echo "::error::Regression suite failed: php tests/test_service_combinations.php"
            failures=$((failures + 1))
          fi
          if ! php tests/test_dns_guard_preservation_5311.php; then
            echo "::error::Regression suite failed: php tests/test_dns_guard_preservation_5311.php"
            failures=$((failures + 1))
          fi
          if ! php tests/test_firewall_policy_5307.php; then
            echo "::error::Regression suite failed: php tests/test_firewall_policy_5307.php"
            failures=$((failures + 1))
          fi
          if ! php tests/test_iot_ssh_scope_5308.php; then
            echo "::error::Regression suite failed: php tests/test_iot_ssh_scope_5308.php"
            failures=$((failures + 1))
          fi
          if ! php tests/test_lan_ingress_spoof_5309.php; then
            echo "::error::Regression suite failed: php tests/test_lan_ingress_spoof_5309.php"
            failures=$((failures + 1))
          fi
          if (( failures > 0 )); then
            echo "$failures regression suite(s) failed"
            exit 1
          fi
      - name: ShellCheck diagnostics (advisory)
        continue-on-error: true
        run: |
          shellcheck -S warning runtime/iptm-helper installer/install.sh
