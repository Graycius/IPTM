name: Semgrep community security analysis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '46 4 * * 3'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Semgrep Community Edition
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Scan PHP, Python, JS and scripts (advisory baseline)
        continue-on-error: true
        run: semgrep scan --config p/security-audit --config p/php --metrics=off --sarif --output semgrep.sarif .
      - name: Upload findings to GitHub Code Scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
